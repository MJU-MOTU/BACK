spring:
  application:
    name: motu-back
  datasource:
    # 로컬 기본값은 compose.yaml의 MySQL. 배포 환경에서는 환경 변수로 덮어쓴다
    url: ${DB_URL:jdbc:mysql://localhost:3306/motu}
    username: ${DB_USERNAME:motu}
    password: ${DB_PASSWORD:motu}
    hikari:
      # 주문 1건에 MySQL로 가던 문장 30개 중 16개가 트랜잭션마다 autocommit·read-only·격리 수준을
      # 바꿨다 되돌리는 SET이었다. 아래 설정으로 같은 값이면 보내지 않고, autocommit 전환은 아예 없앤다
      auto-commit: false
      # 체결 트랜잭션이 쓰는 격리 수준을 기본값으로 둔다(REPEATABLE READ 스냅샷 문제는 주문 ADR 참고)
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        useLocalSessionState: true
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        cacheServerConfiguration: true
        cacheResultSetMetadata: true
        rewriteBatchedStatements: true
  jpa:
    # 스키마는 Flyway가 만들고, JPA는 엔티티와 맞는지만 확인한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # 커넥션이 이미 autocommit=false라고 Hibernate에 알려, 트랜잭션마다 확인·전환하지 않게 한다
        connection:
          provider_disables_autocommit: true
  flyway:
    enabled: true

server:
  # 배포 플랫폼이 PORT를 정해 주면 그 포트로 뜬다
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

motu:
  jwt:
    # 기본값이 없다. 비어 있거나 32바이트보다 짧으면 서버가 뜨지 않는다 (로컬은 local 프로필)
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  kis:
    # 키가 없으면 꺼 둔다. 꺼져 있으면 저장된 마지막 가격만 보여 준다
    enabled: ${KIS_ENABLED:false}
    base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
  cors:
    # 프론트 주소(https://..., 쉼표로 구분). 비어 있으면 다른 출처의 브라우저 요청을 모두 막는다
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  wallet:
    # 가입할 때 지갑에 넣어 주는 가상 현금(원)
    initial-cash: 10000000
