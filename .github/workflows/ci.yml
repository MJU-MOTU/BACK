name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # 한글 테스트 이름으로 리포트 파일을 만들 때 로케일이 UTF-8이 아니면 실패한다
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 Testcontainers로 MySQL을 띄운다 (러너에 Docker가 있다)
      - name: 빌드·테스트
        run: ./gradlew build

      # Lambda 배포 묶음이 만들어지는지, SAM 템플릿이 올바른지(SAM 변환 포함) 본다
      - name: Lambda 배포 묶음·템플릿 검사
        run: |
          ./gradlew lambdaZip
          pipx run cfn-lint --regions ap-northeast-2 -- deploy/lambda/template.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 배포 이미지를 MySQL과 함께 띄워, DB 연결까지 포함한 헬스체크가 healthy가 되는지 본다
      - name: 이미지 빌드·기동
        run: docker compose --profile app up -d --build --wait --wait-timeout 300

      - name: 실패하면 로그
        if: failure()
        run: docker compose --profile app logs
