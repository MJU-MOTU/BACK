# MOTU 백엔드를 AWS Lambda에 올리는 SAM 템플릿 (Java 21 + SnapStart + Lambda Web Adapter + Function URL)
# 빌드: ./gradlew lambdaZip / 배포: sam deploy -t deploy/lambda/template.yaml --guided (docs/deploy.md)
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MOTU backend (Spring Boot on AWS Lambda with SnapStart)

Parameters:
  DbUrl:
    Type: String
    Description: "RDS 주소. 예: jdbc:mysql://<엔드포인트>:3306/motu?sslMode=REQUIRED"
  DbUsername:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: "Access 토큰 서명 키. openssl rand -base64 48"
  CorsAllowedOrigins:
    Type: String
    Default: ""
    Description: "프론트 주소(쉼표로 구분). 예: https://motu.vercel.app"
  KisEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  KisAppKey:
    Type: String
    Default: ""
    NoEcho: true
  KisAppSecret:
    Type: String
    Default: ""
    NoEcho: true

Resources:
  BackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/motu-back-lambda.zip
      Handler: run.sh
      Runtime: java21
      Architectures: [arm64]
      # CPU는 메모리에 비례한다. 복원 직후 첫 요청과 JIT 워밍업이 빨라지도록 넉넉히 준다
      MemorySize: 2048
      Timeout: 30
      # SnapStart는 게시된 버전에만 적용된다. 배포할 때마다 버전을 게시하고 live 별칭이 가리키게 한다
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:30
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          # DB까지 연결돼 UP이어야 준비된 것으로 본다(스냅샷도 그 뒤에 찍힌다)
          AWS_LWA_READINESS_CHECK_PATH: /actuator/health
          AWS_LWA_READINESS_CHECK_HEALTHY_STATUS: "200-299"
          AWS_LWA_SNAPSTART_BEFORE_CHECKPOINT_PATH: /internal/snapstart/before-checkpoint
          AWS_LWA_SNAPSTART_AFTER_RESTORE_PATH: /internal/snapstart/after-restore
          SPRING_PROFILES_ACTIVE: lambda
          DB_URL: !Ref DbUrl
          DB_USERNAME: !Ref DbUsername
          DB_PASSWORD: !Ref DbPassword
          JWT_SECRET: !Ref JwtSecret
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          KIS_ENABLED: !Ref KisEnabled
          KIS_APP_KEY: !Ref KisAppKey
          KIS_APP_SECRET: !Ref KisAppSecret
      # CORS는 Spring이 처리한다(URL 쪽 CORS 설정을 켜면 헤더가 두 번 붙는다)
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  ApiUrl:
    Description: 프론트 VITE_API_BASE_URL에 넣을 주소
    Value: !GetAtt BackFunctionUrl.FunctionUrl
